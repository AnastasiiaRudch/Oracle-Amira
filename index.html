<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оракул «Затмення» — Картки</title><link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <span class="moon">🌑</span>
  <h1>Оракул «Затмення»</h1>
  <p>з нуля до профі · Алла Nera · 158 карт</p>
</header>

<!-- TOP NAV -->
<nav class="topnav">
  <button class="tnav-btn active" data-pg="cat">🃏 Каталог карт</button>
  <button class="tnav-btn" data-pg="sp">✨ Мій розклад&nbsp;<span class="spread-pill" id="spill">0</span></button>
</nav>

<!-- CATALOG PAGE -->
<div class="page on" id="cat">
  <div class="controls">
    <div class="srch">
      <span class="ico">🔍</span>
      <input type="text" id="search" placeholder="Пошук за номером або назвою..." autocomplete="off" spellcheck="false">
    </div>
    <div class="filters">
      <button class="fbtn active" data-b="all">Всі</button>
      <button class="fbtn" data-b="Леноран">Ленорман</button>
      <button class="fbtn" data-b="Загальний">Загальний</button>
      <button class="fbtn" data-b="Магічний">Магічний</button>
    </div>
    <span id="cnt"></span>
  </div>
  <div id="grid"></div>
  <div id="nores">
    <div class="s">🔮</div>
    <p>Карток не знайдено</p>
  </div>
</div>

<!-- SPREAD PAGE -->
<div class="page" id="sp">
  <div id="sp-inner">
    <div class="sp-hdr">
      <div class="sp-title">✨ Мій розклад <span class="spread-pill" id="spill2" style="font-size:.75rem;padding:3px 10px">0</span></div>
      <button class="btn-clear" onclick="clearSpread()">🗑&nbsp; Видалити розклад</button>
    </div>
    <div id="semp" class="sp-empty">
      <div class="s">🌙</div>
      <p>Розклад ще порожній</p>
      <span>Перейдіть до каталогу і натисніть «＋ До розкладу» поруч із карткою</span>
    </div>
    <div id="sgrid"></div>
  </div>
</div>

<!-- MODAL -->
<div class="mov" id="mov">
  <div class="modal">
    <div class="modal-top">
      <img class="mimg" id="mimg" src="" alt="">
      <div class="mbody">
        <button class="mclose" onclick="closeM()">✕</button>
        <div class="mbadge" id="mbadge"></div>
        <div class="mtitle" id="mtitle"></div>
        <div class="mnum" id="mnum"></div>
        <div class="mdesc" id="mdesc"></div>
      </div>
    </div>
    <div class="mfoot">
      <button class="madd" id="madd">＋ Додати до розкладу</button>
    </div>
  </div>
</div>

<script src="assets/cards.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
